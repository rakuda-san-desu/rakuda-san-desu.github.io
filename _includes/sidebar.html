    <aside id="sidebar">
      <section class="widget">
        <h2>最近の記事</h2>
        <ul>
          {% for post in site.posts limit:5 %}
          <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
          {% endfor %}
        </ul>
      </section>
      <section class="widget">
        <h2>カテゴリー</h2>
        <p><a href="{{ '/categories/' | relative_url }}">カテゴリー一覧を見る</a></p>
      </section>
      <section class="widget">
        <h2>タグ</h2>
        <p><a href="{{ '/tags/' | relative_url }}">タグ一覧を見る</a></p>
      </section>
    </aside>
